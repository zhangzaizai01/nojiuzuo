<style>
:root{
  --paper:#E8DFCF;
  --ink:#4A4234;
  --ink-soft:rgba(74,66,52,.55);
  --wood:#6B4A2F;
  --wood-hi:#7A5636;
  --line:#CFC3A9;
  --hand:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi","DFKai-SB","LXGW WenKai",cursive;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh;
  min-height:100dvh;
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, rgba(120,100,70,.030) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(120,100,70,.020) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(48deg, rgba(255,255,255,.045) 0 2px, transparent 2px 9px);
  color:var(--ink);
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) 20px 190px;
  user-select:none;
}
button{
  font:inherit; color:var(--ink);
  background:none; border:1px solid var(--line); border-radius:999px;
  min-height:44px; min-width:44px; padding:0 18px; cursor:pointer;
  transition:opacity .3s ease, border-color .3s ease, transform .12s ease;
}
button:active{ transform:scale(.95); }

/* 法号 */
#dharma{
  font-family:var(--hand);
  font-size:clamp(22px,5vw,30px);
  letter-spacing:.22em; padding-left:.22em;
  margin-top:10px; text-align:center;
}

#dharmaLabel{
  font-size:12px; color:var(--ink-soft);
  letter-spacing:.4em; padding-left:.4em;
  margin-top:6px; text-align:center;
}

/* 圆形倒计时 */
#timerWrap{ position:relative; width:min(72vw,300px); aspect-ratio:1/1; margin:5vh 0 2vh; }
#timerWrap svg{ width:100%; height:100%; display:block; }
#timeText{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:"Helvetica Neue","PingFang SC",Arial,sans-serif;
  font-weight:200; font-size:clamp(44px,13vw,62px);
  letter-spacing:.14em; padding-left:.14em; color:var(--ink);
}

/* 时长切换 */
#modes{ display:flex; gap:14px; }
#modes button{ font-size:14px; letter-spacing:.1em; padding:0 16px; opacity:.6; }
#modes button.on{ opacity:1; border-color:var(--ink); }
body[data-state="running"] #modes button,
body[data-state="guiding"] #modes button{ pointer-events:none; opacity:.35; }

/* 开始 */
#startBtn{
  margin-top:22px; min-width:180px; padding:0 30px;
  letter-spacing:.4em; padding-left:calc(30px + .4em);
  font-size:16px; border-color:var(--ink);
}
body[data-state="running"] #startBtn,
body[data-state="guiding"] #startBtn{ border-color:var(--line); font-size:14px; }

/* 小人（用户提供的形象） */
#figure{ margin-top:4vh; }
#monkImg{
  width:min(52vw,220px); height:auto; display:block;
  animation:breathe 2.4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-3px); }
}

/* 声音开关与提示 */
#soundBtn{ margin-top:14px; border:none; min-height:44px; padding-bottom:0; font-size:13px; color:var(--ink-soft); letter-spacing:.15em; }
#soundHint{
  margin-top:-8px; font-size:12px; color:var(--ink-soft);
  letter-spacing:.1em; opacity:0;
}
#soundHint.show{ animation:hintFade 5.5s ease forwards; }
@keyframes hintFade{
  0%{ opacity:0; } 15%{ opacity:1; }
  70%{ opacity:1; } 100%{ opacity:0; }
}

/* 底部小字 */
#stats{ margin-top:auto; padding-top:24px; font-size:13px; color:var(--ink-soft); letter-spacing:.1em; }
#disclaimer{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  font-size:11px; line-height:1.6; text-align:center;
  color:rgba(90,80,60,.5);
}

/* 判官时刻：主界面安静退场 */
#dharma,#timerWrap,#modes,#startBtn,#figure,#soundBtn,#stats{ transition:opacity 1.5s ease; }
body[data-state="done"] #dharma,
body[data-state="done"] #timerWrap,
body[data-state="done"] #modes,
body[data-state="done"] #startBtn,
body[data-state="done"] #figure,
body[data-state="done"] #soundBtn,
body[data-state="done"] #stats,
body[data-state="guiding"] #dharma,
body[data-state="guiding"] #timerWrap,
body[data-state="guiding"] #modes,
body[data-state="guiding"] #startBtn,
body[data-state="guiding"] #figure,
body[data-state="guiding"] #soundBtn,
body[data-state="guiding"] #stats{ opacity:0; }

/* 暗幕与判词 */
#veil{
  position:fixed; inset:0; background:#000; opacity:0;
  pointer-events:none; transition:opacity 2.2s ease; z-index:40;
}
#veil.on{ opacity:.6; pointer-events:auto; }
#verdict{
  position:fixed; inset:0; z-index:41;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:34px; padding:24px; text-align:center;
  opacity:0; pointer-events:none; transition:opacity 1.4s ease .7s;
}
#verdict.on{ opacity:1; pointer-events:auto; }
#verdictText{
  margin:0; font-family:var(--hand);
  font-size:clamp(22px,5.4vw,34px); line-height:1.9;
  color:#F2ECDD; max-width:26em;
}
#verdict button{
  border-color:rgba(242,236,221,.45); color:#F2ECDD;
  min-width:150px; font-family:var(--hand);
  font-size:19px; letter-spacing:.35em; padding:0 26px;
}
#vbtns{ display:flex; flex-direction:column; gap:16px; }

/* 起身引导 */
#guide{
  position:fixed; inset:0; z-index:41;
  display:flex; align-items:center; justify-content:center; padding:24px;
  opacity:0; pointer-events:none; transition:opacity .9s ease;
}
#guide.on{ opacity:1; pointer-events:auto; }
#guideLine{
  margin:0; font-family:var(--hand);
  font-size:clamp(20px,5vw,30px); line-height:2.1;
  color:#F2ECDD; max-width:20em; text-align:center;
}

/* 木鱼 */
#muyuBtn{
  position:fixed; right:48px; bottom:calc(118px + env(safe-area-inset-bottom));
  z-index:30; width:56px; height:48px;
  border:none; padding:0; background:none;
  display:flex; align-items:flex-end; justify-content:center;
}
#muyuShape{
  position:relative; width:54px; height:42px;
  background:radial-gradient(ellipse at 50% 18%, var(--wood-hi), var(--wood) 72%);
  border-radius:27px 27px 8px 8px / 36px 36px 8px 8px;
  box-shadow:0 4px 8px rgba(60,45,25,.35);
  transition:transform .12s ease;
}
#muyuShape::after{
  content:""; position:absolute; left:25%; top:38%;
  width:50%; height:3px; border-radius:3px;
  background:rgba(232,223,207,.85);
  transform:rotate(-13deg);
}
#muyuBtn:active #muyuShape{ transform:scale(.88); }
#muyuWish{
  position:fixed; right:41px; width:70px;
  bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:30; font-size:12px; color:var(--ink-soft);
  text-align:center; letter-spacing:.18em;
}
/* 吉祥词：以木鱼为中心，向上 90 度扇形内沿路径滑出并渐隐 */
.fish-word{
  position:fixed; z-index:35;
  font-size:12px; color:var(--ink-soft);
  letter-spacing:.18em; white-space:nowrap; pointer-events:none;
  transform:translate(-50%,-50%);
  animation:wordFloat 2.2s ease-out both;
}
@keyframes wordFloat{
  0%{ opacity:0; transform:translate(-50%,-50%) translate(calc(var(--tx,0px) * .35), calc(var(--ty,0px) * .35)) scale(.9); }
  30%{ opacity:1; transform:translate(-50%,-50%) translate(calc(var(--tx,0px) * .55), calc(var(--ty,0px) * .55)) scale(1); }
  70%{ opacity:1; transform:translate(-50%,-50%) translate(calc(var(--tx,0px) * .85), calc(var(--ty,0px) * .85)) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-50%) translate(var(--tx,0px), var(--ty,0px)) scale(1); }
}
/* 小和尚名牌 */
#monkName{
  font-family:var(--hand); font-size:15px; color:var(--ink-soft);
  letter-spacing:.5em; padding-left:.5em;
  margin-top:10px; text-align:center;
}

/* 装到桌面 */
#installBtn{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(112px + env(safe-area-inset-bottom)); z-index:30;
  font-size:13px; padding:0 20px; letter-spacing:.15em;
  background:rgba(255,255,255,.35);
}
#installBtn:active{ transform:translateX(-50%) scale(.95); }

/* 通知授权入口 */
#notifyBtn{
  margin-top:10px; border:none; min-height:36px;
  font-size:12px; color:var(--ink-soft); letter-spacing:.2em;
  border-bottom:1px solid var(--line); border-radius:0;
}
#notifyBtn:disabled{ opacity:.45; }

@media (min-width:600px){
  #timerWrap{ width:300px; }
}
</style>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };

/* ---------- 常量与存储 ---------- */
var DHARMAS = ["慢慢直起的腰","今天没弯腰","第三腰椎居士","腹横肌初醒","铁杵磨针居士"];
var K = { dharma:"jiuozuo.dharma", fish:"jiuozuo.fish", rise:"jiuozuo.rise", dur:"jiuozuo.duration" };
function ls(k, v){
  try{
    if(v === undefined) return localStorage.getItem(k);
    if(v === null){ localStorage.removeItem(k); return null; }
    localStorage.setItem(k, v); return v;
  }catch(e){ return null; }
}
function today(){
  var d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

/* ---------- 状态 ---------- */
var duration = parseInt(ls(K.dur) || "45", 10);
if([30,45,60].indexOf(duration) < 0) duration = 45;
/* 隐藏演示模式：URL 带 ?demo=1 时倒计时缩为 30 秒；?demo=3 即 3 秒，便于快速体验判官时刻 */
var _dm = location.search.match(/[?&]demo=(\d+)/);
var demo = !!_dm;
var demoSecs = demo ? Math.max(1, parseInt(_dm[1], 10) || 30) : 30;
var total = demo ? demoSecs * 1000 : duration * 60000;
var endTime = 0;          /* 归零时刻的真实时间戳（切后台/冻结定时器也按真实时钟补算） */
var remaining = total;
var state = "idle";       /* idle | running | done | guiding */
var hiddenAt = 0;
var RING_C = 2 * Math.PI * 108;

/* ---------- 法号 ---------- */
var dharma = ls(K.dharma);
if(!dharma){
  dharma = DHARMAS[Math.floor(Math.random() * DHARMAS.length)];
  ls(K.dharma, dharma);
}
$("dharma").textContent = dharma;

/* ---------- 统计 ---------- */
var fish = parseInt(ls(K.fish) || "0", 10) || 0;
var riseData = null;
try{ riseData = JSON.parse(ls(K.rise) || "null"); }catch(e){ riseData = null; }
if(!riseData || riseData.d !== today()) riseData = { d: today(), n: 0 };
function renderStats(){
  $("stats").textContent = "今日起身 " + riseData.n + " 次";
}
renderStats();

/* ---------- Web Audio：木鱼 + 雨 ---------- */
var AC = null, reverbIn = null;
function actx(){
  if(!AC){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    AC = new Ctx();
    /* 共享轻回响总线：反馈延迟 */
    var dl = AC.createDelay(0.5); dl.delayTime.value = 0.11;
    var fb = AC.createGain(); fb.gain.value = 0.28;
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1000;
    var wet = AC.createGain(); wet.gain.value = 0.22;
    dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet); wet.connect(AC.destination);
    reverbIn = dl;
  }
  if(AC.state === "suspended" && AC.resume) AC.resume();
  if(AC && !loadSamples.done){ loadSamples.done = true; loadSamples(); }
  return AC;
}

var samples = {};
window.__jiuzuoSnd = samples;               /* 便于调试观察加载状态 */
function loadSamples(){
  if(!window.fetch || !AC.decodeAudioData) return;
  Object.keys(SAMPLE_URIS).forEach(function(name){
    fetch(SAMPLE_URIS[name])
      .then(function(r){ return r.arrayBuffer(); })
      .then(function(ab){ return AC.decodeAudioData(ab); })
      .then(function(buf){ samples[name] = buf; })
      .catch(function(){});
  });
}
function playSample(name, rate, vol){
  var buf = samples[name];
  if(!buf) return false;
  var c = actx();
  var src = c.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = rate || 1;
  var g = c.createGain(); g.gain.value = vol || 1;
  src.connect(g); g.connect(c.destination);
  src.start(0);
  return true;
}
/* 寺庙木鱼"咚"（合成兜底）：空腔木质主体 + 高次泛音 + 低频厚度 + 敲击瞬态 + 轻回响 */
function synthKnock(){
  var c = actx(), t = c.currentTime;
  var bus = c.createGain(); bus.gain.value = 0.9;
  bus.connect(c.destination);
  if(reverbIn) bus.connect(reverbIn);
  /* 主体：快速下滑正弦，短促空腔"咚" */
  var o = c.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(350, t);
  o.frequency.exponentialRampToValueAtTime(240, t + 0.07);
  var g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.9, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
  o.connect(g); g.connect(bus);
  o.start(t); o.stop(t + 0.35);
  /* 高次泛音：木质亮度，衰减更快 */
  var o2 = c.createOscillator(); o2.type = "sine";
  o2.frequency.setValueAtTime(760, t);
  o2.frequency.exponentialRampToValueAtTime(660, t + 0.04);
  var g2 = c.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.28, t + 0.004);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o2.connect(g2); g2.connect(bus);
  o2.start(t); o2.stop(t + 0.15);
  /* 低频鼓点：厚度 */
  var o3 = c.createOscillator(); o3.type = "sine";
  o3.frequency.setValueAtTime(150, t);
  o3.frequency.exponentialRampToValueAtTime(105, t + 0.08);
  var g3 = c.createGain();
  g3.gain.setValueAtTime(0.0001, t);
  g3.gain.exponentialRampToValueAtTime(0.4, t + 0.006);
  g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o3.connect(g3); g3.connect(bus);
  o3.start(t); o3.stop(t + 0.22);
  /* 敲击瞬态：木头质感 */
  var len = (c.sampleRate * 0.04) | 0;
  var nb = c.createBuffer(1, len, c.sampleRate), nd = nb.getChannelData(0);
  for(var i = 0; i < len; i++) nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  var ns = c.createBufferSource(); ns.buffer = nb;
  var nf = c.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 1100; nf.Q.value = 1.2;
  var ng = c.createGain(); ng.gain.value = 0.12;
  ns.connect(nf); nf.connect(ng); ng.connect(bus);
  ns.start(t);
}
/* 寺庙敲钟一声（合成兜底）：非谐分音长衰减 + 失谐拍频"嗡"声 + 撞击瞬态 */
function synthBell(){
  var c = actx(), t = c.currentTime;
  var bus = c.createGain(); bus.gain.value = 0.75;
  bus.connect(c.destination);
  if(reverbIn) bus.connect(reverbIn);
  /* 大钟分音：基频 + 非谐泛音，各自长指数衰减 */
  var parts = [
    [164, 0.50, 7.0],
    [328, 0.30, 5.2],
    [442, 0.20, 4.0],
    [876, 0.10, 2.6],
    [1310, 0.05, 1.5]
  ];
  for(var i = 0; i < parts.length; i++){
    var f = parts[i][0], amp = parts[i][1], dur = parts[i][2];
    var o = c.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(f * (1 + (Math.random() * 0.004 - 0.002)), t);
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + dur + 0.1);
  }
  /* 失谐双基频：缓慢的"嗡——"起伏 */
  var b1 = c.createOscillator(); b1.type = "sine"; b1.frequency.value = 164;
  var b2 = c.createOscillator(); b2.type = "sine"; b2.frequency.value = 165.2;
  var bg = c.createGain();
  bg.gain.setValueAtTime(0.0001, t);
  bg.gain.exponentialRampToValueAtTime(0.16, t + 0.03);
  bg.gain.exponentialRampToValueAtTime(0.0001, t + 7.0);
  b1.connect(bg); b2.connect(bg); bg.connect(bus);
  b1.start(t); b2.start(t);
  b1.stop(t + 7.2); b2.stop(t + 7.2);
  /* 撞击瞬态：钟槌落点 */
  var len = (c.sampleRate * 0.05) | 0;
  var nb = c.createBuffer(1, len, c.sampleRate), nd = nb.getChannelData(0);
  for(var j = 0; j < len; j++) nd[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / len, 4);
  var ns = c.createBufferSource(); ns.buffer = nb;
  var nf = c.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 500; nf.Q.value = 1;
  var ng = c.createGain(); ng.gain.value = 0.35;
  ns.connect(nf); nf.connect(ng); ng.connect(bus);
  ns.start(t);
}
/* 对外入口：优先播放用户采样，加载失败时退回合成音 */

/* ---------- 系统通知：显式授权入口，授权后立即发一条测试横幅 ---------- */
var notifyBtn = $("notifyBtn");
function refreshNotifyBtn(){
  if(!("Notification" in window)){ notifyBtn.hidden = true; return; }
  notifyBtn.hidden = (Notification.permission === "granted");
  if(Notification.permission === "denied"){
    notifyBtn.textContent = "提醒已被拒绝 · 请到浏览器地址栏站点设置里允许通知";
  }else if(location.protocol === "file:"){
    /* 本地双击打开（file://）：Chrome 无法持久保存通知权限 */
    notifyBtn.textContent = "file:// 下通知不可靠 · 建议部署 GitHub Pages（https）后使用";
  }else{
    var ua = navigator.userAgent || "";
    var isSafari = /safari/i.test(ua) && !/chrome|crios|fxios|edg/i.test(ua);
    if(isSafari){
      notifyBtn.textContent = "Safari 需先「文件→添加到程序坞」安装本页，再点此授权";
    }
  }
}
refreshNotifyBtn();
notifyBtn.onclick = function(){
  if(!("Notification" in window)) return;
  Notification.requestPermission().then(function(p){
    refreshNotifyBtn();
    if(p === "granted"){
      /* 授权成功立刻发一条测试横幅，让你确认能收到 */
      try{ new Notification("久坐判官殿", { body: "提醒已开启：倒计时结束后会叫您起身", tag: "jiuzuo-on" }); }catch(e){}
    }
  }).catch(function(){});
};

/* ---------- 倒计时 ---------- */
function fmtTime(ms){
  var s = Math.ceil(ms / 1000);
  if(s < 0) s = 0;
  var m = Math.floor(s / 60), ss = s % 60;
  return m + ":" + (ss < 10 ? "0" : "") + ss;
}
function render(){
  $("timeText").textContent = fmtTime(remaining);
  var frac = Math.max(0, remaining) / total;
  $("prog").style.strokeDashoffset = String(RING_C * (1 - frac));
}
function tick(){
  if(state !== "running") return;
  remaining = endTime - Date.now();   /* 用真实时钟补算，后台冻结定时器也不影响 */
  if(remaining <= 0){ remaining = 0; render(); finish(); }
  else render();
}
setInterval(tick, 250);

/* Worker 计时器：页面切到后台时主线程定时器会被浏览器节流，
   Worker 内的 setTimeout 不受影响，保证归零瞬间准时触发提醒 */
var workerSrc = "var t=null;onmessage=function(e){var d=e.data||{};" +
  "if(d.cmd==='start'){if(t)clearTimeout(t);t=setTimeout(function(){postMessage('done');},Math.max(0,d.ms));}" +
  "else if(d.cmd==='stop'){if(t)clearTimeout(t);t=null;}};";
var timerWorker = null;
try{
  timerWorker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: "application/javascript" })));
  timerWorker.onmessage = function(){ tick(); };
}catch(e){}

function setState(s){
  state = s;
  document.body.dataset.state = s;
  $("startBtn").textContent =
    s === "running" ? "中 止 静 坐" : "开 始 静 坐";
}
function resetToIdle(){
  remaining = total;
  $("startBtn").hidden = false;
  setState("idle");
  render();
}

$("startBtn").onclick = function(){
  if(state === "running"){        /* 中止 */
    if(timerWorker) timerWorker.postMessage({ cmd: "stop" });
    resetToIdle();
    return;
  }
  if(state !== "idle") return;
  askNotify();
  actx();                          /* 用户手势里解锁音频 */
  endTime = Date.now() + remaining;
  setState("running");
  if(timerWorker) timerWorker.postMessage({ cmd: "start", ms: endTime - Date.now() });
};

var modeBtns = document.querySelectorAll(".mode");
function markModes(){
  for(var i = 0; i < modeBtns.length; i++){
    modeBtns[i].classList.toggle("on",

  }
}
for(var i = 0; i < modeBtns.length; i++){
  modeBtns[i].onclick = function(){
    if(state !== "idle") return;
    duration = parseInt(this.dataset.m, 10);
    ls(K.dur, String(duration));
    total = demo ? demoSecs * 1000 : duration * 60000;
    resetToIdle();
    markModes();
  };
}

/* 桌面端：屏幕正中弹出独立小窗（使用其它软件时也能看到），点任意处关闭，60 秒自动关 */

    var safe = String(dharma).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    var doc = win.document;

      '<div style="margin-top:20px;font-size:36px;letter-spacing:.35em;padding-left:.35em;color:#4A4234;' +
      'font-family:Kaiti SC,STKaiti,KaiTi,DFKai-SB,cursive">请起身</div>' +
      '<div style="margin-top:24px;font-size:12px;color:rgba(74,66,52,.5);letter-spacing:.15em">点击任意处关闭</div>' +
      '</body></html>');

function finish(){

  bell();                          /* 判官时刻：敲钟一声（用户采样） */
  /* 桌面屏幕正中弹窗（若被拦截则退回系统通知） */

  if("Notification" in window && Notification.permission === "granted"){
    try{

  if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
  $("verdictText").textContent =
    demo
      ? "施主已坐 " + demoSecs + " 秒（演示模式），椎间盘压力 +18%，是否起身？"
      : "施主已坐 " + duration + " 分钟，椎间盘压力 +18%，是否起身？";

/* ---------- 吉祥词：每敲一下，从木鱼上方渐显渐隐并向四周发散 ---------- */
var WISHES = {
  waist: ["腰不疼了", "腿不麻了", "腰不酸了", "脖子不僵了",
          "腰杆挺直", "椎间盘笑了", "腰若磐石", "气血通畅"],
  work:  ["领导休假了", "方案一遍过", "会议取消了", "按时下班",
          "需求不返工", "年终奖翻倍", "ddl 延后了", "灵感爆棚"]
};
/* 记录最近弹出词的终点，连续敲击时新词主动避让，防止文字重叠 */
var recentWords = [];
var SLOT_ANGLES = [-42, -21, 0, 21, 42];   /* 90 度扇形均分 5 个槽位 */
var slotCursor = 0;
function spawnWord(){
  var pool = Math.random() < 0.5 ? WISHES.waist : WISHES.work;
  var text = pool[Math.floor(Math.random() * pool.length)];
  var r = $("muyuBtn").getBoundingClientRect();
  var cx = r.left + r.width / 2;
  var cy = r.top - 4;
  var halfW = text.length * 10 + 14;
  var now = Date.now();
  /* 槽位轮转 + 避让打分：优先选与最近活跃词角度/终点都远的槽 */
  var best = null, bestScore = -1;
  for(var i = 0; i < SLOT_ANGLES.length; i++){
    var si = (slotCursor + i) % SLOT_ANGLES.length;
    var ang = SLOT_ANGLES[si] * Math.PI / 180 + (Math.random() * 8 - 4) * Math.PI / 180;
    var dist = 80 + Math.random() * 50;
    var tx = Math.sin(ang) * dist;
    var ty = -Math.cos(ang) * dist;
    var fx = cx + tx;
    fx = Math.min(Math.max(fx, halfW + 8), window.innerWidth - halfW - 8);
    tx = fx - cx;
    var ex = cx + tx, ey = cy + ty;
    var score = Infinity;
    for(var j = 0; j < recentWords.length; j++){
      var p = recentWords[j];
      if(now - p.t > 1300) continue;
      var d = Math.sqrt((p.x - ex) * (p.x - ex) + (p.y - ey) * (p.y - ey));
      var aDiff = Math.abs(ang - p.ang);
      score = Math.min(score, Math.min(d, aDiff * 220));
    }
    if(score > bestScore){ bestScore = score; best = { tx: tx, ty: ty, ex: ex, ey: ey, ang: ang }; }
    if(bestScore > 64) break;
  }
  slotCursor = (slotCursor + 1) % SLOT_ANGLES.length;
  recentWords.push({ x: best.ex, y: best.ey, t: now, ang: best.ang });
  if(recentWords.length > 8) recentWords.shift();
  var s = document.createElement("span");
  s.className = "fish-word";
  s.textContent = text;
  s.style.left = cx + "px";
  s.style.top = cy + "px";
  s.style.setProperty("--tx", best.tx.toFixed(0) + "px");
  s.style.setProperty("--ty", best.ty.toFixed(0) + "px");
  /* 时长微随机 + 并发词错峰启动，让连敲的词节奏错开 */
  s.style.animationDuration = (2.0 + Math.random() * 0.4).toFixed(2) + "s";
  var delay = Math.min(document.querySelectorAll(".fish-word").length * 0.15, 0.45);
  if(delay > 0) s.style.animationDelay = delay.toFixed(2) + "s";
  document.body.appendChild(s);
  s.addEventListener("animationend", function(){ s.remove(); });
}
